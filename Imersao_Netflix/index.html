<!DOCTYPE html>
<html lang="pt-br">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    
    <button id="theme-toggle" onclick="toggleTheme()">☀️</button>
    <!-- <button id="theme-toggle" onclick="toggleTheme()" 
        style="position: absolute; top: 1rem; right: 1rem; z-index: 10; cursor: pointer;"
        aria-label="Alternar tema"></button> -->

    <main>
        <h1>Quem está assistindo?</h1>
        <section aria-label="Perfis disponíveis">
            <nav class="profiles">
                <a href="catalogo.html" class="profile perfil">
                    <figure class="item-perfil">
                        <div class="card">
                            <div class="card-inner">
                                <div class="card-front">
                                    <img src="./assets/retrato-1.png" alt="Laura">
                                </div>
                                <div class="card-back">
                                    <p> • Genêro favorito:<br><span>(romance, drama)</span></p>
                                    <p> • Último filme assistido:<br><span>'Nome do Filme'</p>
                                </div>
                            </div>
                        </div>
                        <figcaption class="nome-perfil">Laura</figcaption>
                    </figure>
                </a>
                <a href="catalogo.html" class="profile perfil">
                    <figure class="item-perfil">
                        <div class="card">
                            <div class="card-inner">
                                <div class="card-front">
                                    <img src="./assets/retrato-3.png" alt="Matheus">
                                </div>
                                <div class="card-back">
                                    <p> • Genêro favorito:<br><span>(ação, suspense)</span></p>
                                    <p> • Último filme assistido:<br><span>'Nome do Filme'</p>
                                </div>
                            </div>
                        </div>
                        <figcaption class="nome-perfil">Matheus</figcaption>
                    </figure>
                </a>
                <a href="catalogo.html" class="profile perfil">
                    <figure class="item-perfil">
                        <div class="card">
                            <div class="card-inner">
                                <div class="card-front">
                                    <img src="./assets/retrato-2.png" alt="Convidado">
                                </div>
                                <div class="card-back">
                                    <p> • Genêro favorito:<br><span>(animação, comédia)</span></p>
                                    <p> • Último filme assistido:<br><span>'Nome do Filme'
                                </div>
                            </div>
                        </div>
                        <figcaption class="nome-perfil">Convidado</figcaption>
                    </figure>
                </a>
                <a href="catalogo.html" class="profile perfil">
                    <figure class="item-perfil">
                        <div class="add-icon">+</div>
                        <figcaption class="nome-perfil">Adicionar perfis</figcaption>
                    </figure>
                </a>
            </nav>
        </section>
    </main>

    <script src="theme.js"></script>
    <script src="index.js"></script>
    
</body>
</html>
